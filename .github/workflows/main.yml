name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Smoke run
        working-directory: backend
        run: |
          if [ -z "$MONGO_URI" ]; then
            echo "Skipping smoke run: MONGO_URI secret is not set."
          else
            timeout 15s node index.js
          fi
